[project]
name = "finassistant"
version = "0.1.0"
description = "Chatbot that ingests bank statements (CSV/PDF) and answers natural language questions about spending"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "faiss-cpu>=1.14.2",
    "gradio>=6.15.2",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-faiss>=0.1.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.12.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "tiktoken>=0.13.0",
    "typer>=0.26.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
