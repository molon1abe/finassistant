[project]
name = "finassistant"
version = "0.1.0"
description = "Chatbot that ingests bank statements (CSV/PDF) and answers natural language questions about spending "
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "faiss-cpu>=1.14.2",
    "langchain>=1.3.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.38.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
